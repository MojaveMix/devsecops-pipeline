# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/todolist?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=test-secret-key-for-testing-purposes-only-must-be-at-least-256-bits-long
jwt.expiration=86400000

# Rate Limiting Configuration
rate.limit.capacity=100
rate.limit.tokens=100
rate.limit.duration=60

# Logging
logging.level.com.myapp=DEBUG